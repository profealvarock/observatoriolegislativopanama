name: Actualizar planillas (Contraloría)

on:
  schedule:
    # Lunes 6:00 AM hora Panamá = 11:00 UTC
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Extraer todo aunque la fecha de corte de la Contraloría no haya cambiado'
        type: boolean
        default: false

jobs:
  planillas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar scraper de planillas
        run: python scraper_planillas.py ${{ inputs.forzar && '--forzar' || '' }}

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add planillas_cgr.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "planillas: revisión semanal de la Contraloría $(date -u '+%Y-%m-%d')"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
