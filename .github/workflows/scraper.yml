name: Actualizar datos legislativos

on:
  schedule:
    # 4:00 AM hora Panamá = 9:00 AM UTC (Panamá es UTC-5)
    - cron: '0 9 * * *'
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar navegador Chromium
        run: playwright install chromium --with-deps

      # Va antes del scraper principal para que las novedades incluyan las votaciones nuevas.
      # Si la API de prensa507 falla, se conservan las votaciones guardadas y el resto sigue.
      - name: Votaciones nominales (prensa507)
        run: python scraper_votaciones.py
        continue-on-error: true
        timeout-minutes: 22

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Verificar archivos generados
        run: |
          echo "=== resumen.json ==="
          python -c "import json; d=json.load(open('resumen.json')); print('Fecha:', d['fecha_extraccion']); print('Proyectos:', d['total_proyectos']); print('Diputados:', d['total_diputados'])"

      - name: Commit y push de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos.json diputados.json resumen.json metricas_diputados.json historico.json sitemap.xml
          git add etapas_historico.json novedades.json novedades.xml
          git add votaciones.json votaciones.csv preguntas.csv votos.csv votaciones_estado.json votaciones_calidad.json
          git add votos_diputado.json votos_matriz.json
          git add -A votaciones
          git add -A diputado
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualización automática $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
            echo "Push exitoso."
          fi
