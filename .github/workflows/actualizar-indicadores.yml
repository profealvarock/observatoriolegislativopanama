name: Actualizar indicadores (Aprobación, Sismo, Costo de vida, Minería)

on:
  schedule:
    # Lunes 6:00 AM hora Panamá = 11:00 UTC (mismo horario que planillas.yml: por eso el push hace rebase)
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      solo:
        description: 'Módulos separados por coma (vacío = todos): combustible,cbfa,pendientes,sinaproc,igc,encuestas,noticias_mineria,salarios,foto'
        type: string
        default: ''

concurrency:
  group: actualizar-indicadores
  cancel-in-progress: false

jobs:
  indicadores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pypdf openpyxl pytest

      # Si un parser se rompe, las pruebas fallan antes de tocar los datos.
      - name: Pruebas de los parsers y de la regla de frescura
        run: |
          python -m pytest tests -q
          node --test tests/frescura.test.mjs

      # El script no falla si una fuente está caída: conserva el valor y lo anota en "advertencias".
      - name: Ejecutar actualización
        env:
          SOLO: ${{ inputs.solo }}
        run: |
          if [ -n "$SOLO" ]; then
            python scripts/actualizar_indicadores.py --solo "$SOLO"
          else
            python scripts/actualizar_indicadores.py
          fi

      - name: Validar JSON
        run: |
          for f in data/aprobacion.json data/sismo.json data/costo_vida.json data/mineria.json data/salarios.json; do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f"
          done

      - name: Commit y push (solo si hay cambios)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aprobacion.json data/sismo.json data/costo_vida.json data/mineria.json data/salarios.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los indicadores."
          else
            git commit -m "chore(datos): corte semanal $(TZ=America/Panama date '+%Y-%m-%d')"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
